services:
  mongodb1:
    image: mongo:8.0
    hostname: mongodb1
    container_name: mongodb1
    restart: always
    # volumes:
    #   - ./mongodb1_data:/data/db
    ports:
      - 27017:27017
    entrypoint: ["mongod", "--replSet", "myReplicaSet", "--bind_ip", "localhost,mongodb1"]

  mongodb2:
    image: mongo:8.0
    hostname: mongodb2
    container_name: mongodb2
    restart: always
    # volumes:
    #   - ./mongodb2_data:/data/db
    ports:
      - 27018:27017
    entrypoint: ["mongod", "--replSet", "myReplicaSet", "--bind_ip", "localhost,mongodb2"]

  mongodb3:
    image: mongo:8.0
    hostname: mongodb3
    container_name: mongodb3
    restart: always
    # volumes:
    #   - ./mongodb3_data:/data/db
    ports:
      - 27019:27017
    entrypoint: ["mongod", "--replSet", "myReplicaSet", "--bind_ip", "localhost,mongodb3"]

  mongosetup:
    image: mongo:8.0
    depends_on:
      - mongodb1
      - mongodb2
      - mongodb3
    volumes:
      - ./scripts:/scripts
    container_name: mongosetup
    restart: "no"
    entrypoint: [ "bash", "/scripts/mongo_setup.sh"]

# volumes:
#   mongodb1_data:
#   mongodb2_data:
#   mongodb3_data: